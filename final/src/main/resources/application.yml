spring:
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  datasource:
    url: jdbc:mysql://localhost:3306/insider
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    database: mysql
    generate-ddl: false
    properties:
      hibernate:
        format_sql: true


server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

file:
  upload-dir: "C:/login/"
  file-dir: "upload"

websocket:
  servlet:
    max-binary-message-buffer-size: 500000
    max-text-message-buffer-size: 50000

jwt:
  key: ${JWT_KEY}
  time: 86400000

logging:
  level:
    org:
      hibernate:
        sql: debug
